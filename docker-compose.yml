# =============================================================================
# Woobar — Docker Compose (produção / Portainer Stack)
# =============================================================================
# Uso no Portainer:
#   1. Stacks > Add stack > Git ou Upload de arquivo
#   2. Envie este docker-compose.yml junto com um .env (use .env.example como base)
#   3. Defina APP_DOMAIN, CORS_ORIGIN, APP_URL, JWT_SECRET (>= 32 chars) e FISCAL_TOKEN no Environment da stack
#      JWT_SECRET pode ser gerado com: openssl rand -hex 32
#   4. Deploy — HTTPS é terminado pelo Caddy em 80/443
#
# O Caddy termina TLS automaticamente. Defina:
#   APP_DOMAIN=seu-dominio.com
#   CORS_ORIGIN=https://seu-dominio.com
#   APP_URL=https://seu-dominio.com
# =============================================================================

services:
  woobar:
    image: ghcr.io/fluowai/woobar:main
    container_name: woobar
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Secrets must be supplied by Portainer/Docker Compose; never bake them into the image.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET obrigatório (mín. 32 caracteres; use openssl rand -hex 32)}
      - DATABASE_PATH=/app/data/woobar.db
      - CORS_ORIGIN=${CORS_ORIGIN:?CORS_ORIGIN obrigatório em produção}
      - APP_URL=${APP_URL:?APP_URL obrigatório em produção}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
      - FISCAL_URL=${FISCAL_URL:-http://fiscal:8080}
      - FISCAL_TOKEN=${FISCAL_TOKEN:?FISCAL_TOKEN obrigatório}
      # Bootstrap opcional do Mega Admin. Informe os dois valores no Portainer
      # para criar/atualizar a conta no volume persistente do banco.
      - MEGA_ADMIN_EMAIL=${MEGA_ADMIN_EMAIL:-}
      - MEGA_ADMIN_PASSWORD=${MEGA_ADMIN_PASSWORD:-}
    volumes:
      - woobar_data:/app/data
      - woobar_uploads:/app/uploads
    depends_on:
      fiscal:
        condition: service_healthy
    networks:
      - woo-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    container_name: woobar-caddy
    restart: unless-stopped
    environment:
      - APP_DOMAIN=${APP_DOMAIN:?APP_DOMAIN obrigatório em produção}
    command:
      - caddy
      - reverse-proxy
      - --from
      - woobar.wootech.com.br
      - --to
      - http://woobar:3001
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      woobar:
        condition: service_healthy
    networks:
      - woo-network

  fiscal:
    image: ghcr.io/fluowai/woobar-fiscal:main
    container_name: woobar-fiscal
    restart: unless-stopped
    environment:
      - FISCAL_TOKEN=${FISCAL_TOKEN:?FISCAL_TOKEN obrigatório}
      - FISCAL_STORAGE=/app/storage
    volumes:
      - fiscal_storage:/app/storage
    expose:
      - "8080"
    networks:
      - woo-network
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8080/health') ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  woo-network:
    external: true
    name: woo-network

volumes:
  woobar_data:
  woobar_uploads:
  fiscal_storage:
  caddy_data:
  caddy_config:
