name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Instalar dependências (web)
        run: npm ci

      - name: Instalar dependências (server)
        run: npm ci
        working-directory: server

      - name: Typecheck web
        run: npm run lint

      - name: Typecheck server
        run: npx tsc --noEmit
        working-directory: server

      - name: Testes server
        run: npm test
        working-directory: server

      - name: Build completo
        run: npm run build:all
