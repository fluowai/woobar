name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Instalar dependências (web)
        run: npm ci

      - name: Instalar dependências (server)
        run: npm ci
        working-directory: server

      - name: Typecheck web
        run: npm run lint

      - name: Typecheck server
        run: npx tsc --noEmit
        working-directory: server

      - name: Testes server
        run: npm test
        working-directory: server

      - name: Auditoria de dependências web
        run: npm audit --audit-level=high --omit=dev

      - name: Auditoria de dependências server
        run: npm audit --audit-level=high --omit=dev
        working-directory: server

      - name: Validar configuração Docker Compose
        env:
          APP_DOMAIN: ci.example.com
          CORS_ORIGIN: https://ci.example.com
          APP_URL: https://ci.example.com
          JWT_SECRET: ci-jwt-secret-012345678901234567890123456789
          FISCAL_TOKEN: ci-fiscal-token-012345678901234567890123456789
        run: docker compose config -q

      - name: Build completo
        run: npm run build:all

      - name: Validar imagem Docker
        run: docker build --tag woobar:ci .
